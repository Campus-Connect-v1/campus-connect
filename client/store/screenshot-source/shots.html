<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: G; src: url(../../assets/fonts/Gilroy-Regular.ttf); font-weight: 400; }
@font-face { font-family: G; src: url(../../assets/fonts/Gilroy-Medium.ttf); font-weight: 500; }
@font-face { font-family: G; src: url(../../assets/fonts/Gilroy-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: BB; src: url(../../assets/fonts/Blackbold/Blackbold.ttf); }
:root {
  --violet: #6C3BFF; --pink: #FF3D81; --yellow: #FFD84D; --lime: #B8FF5A;
  --warm: #F8F7F4; --ink: #161616; --sunken: #EEECE7; --border: #E4E1DA;
  --text2: #4B4740; --muted: #8A847A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #888; font-family: G, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
img { display: block; object-fit: cover; }

/* ---------- marketing slide ---------- */
.slide { width: 440px; height: 956px; position: relative; overflow: hidden; }
.slide .copy { position: absolute; top: 56px; left: 32px; right: 32px; text-align: center; z-index: 2; }
.slide h1 { font-family: BB; font-weight: 400; font-size: 39px; line-height: 1.0; letter-spacing: 0.2px; }
.slide .sub { font-size: 16.5px; font-weight: 500; line-height: 1.32; margin-top: 14px; opacity: 0.82; }
.deco { position: absolute; inset: 0; z-index: 0; pointer-events: none; }

.phone { position: absolute; left: 50%; top: 252px; width: 330px; height: 697px; margin-left: -165px;
  background: #0d0d0d; border-radius: 56px; padding: 10px; z-index: 1;
  box-shadow: 0 30px 60px rgba(0,0,0,.28), 0 0 0 1.5px rgba(255,255,255,.12) inset; }
.phone .screen { width: 310px; height: 677px; border-radius: 46px; overflow: hidden; position: relative; background: var(--warm); }
.phone .screen > .ui { width: 440px; height: 961px; transform: scale(0.70455); transform-origin: 0 0; position: relative; overflow: hidden; color: var(--ink); }
.island { position: absolute; top: 19px; left: 50%; width: 90px; height: 26px; margin-left: -45px; background: #000; border-radius: 20px; z-index: 50; }

/* ---------- in-app UI ---------- */
.status { height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 6px 38px 0 46px; font-weight: 600; font-size: 17px; position: relative; z-index: 40; }
.status .r { display: flex; gap: 6px; align-items: center; }
.tabbar { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); background: rgba(22,22,22,.92); border-radius: 999px; padding: 8px; display: flex; gap: 6px; align-items: center; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,.22); }
.tabbar .t { width: 50px; height: 50px; display: grid; place-items: center; color: rgba(255,255,255,.65); }
.tabbar .t.on { width: auto; padding: 0 18px 0 14px; border-radius: 999px; display: flex; gap: 8px; font-weight: 600; font-size: 15px; }
.row { display: flex; align-items: center; }
.av { border-radius: 999px; object-fit: cover; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #fff; border: 1px solid var(--border); white-space: nowrap; }
.h-title { font-family: BB; font-size: 34px; font-weight: 400; letter-spacing: .2px; }
.muted { color: var(--muted); }
.card { background: #fff; border-radius: 18px; }
.scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.72) 100%); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; font-weight: 600; font-size: 14px; padding: 9px 16px; }
.stack img { width: 24px; height: 24px; border-radius: 999px; border: 2px solid #fff; margin-left: -8px; }
.stack img:first-child { margin-left: 0; }

/* ---------- iPad layout: the same phone, contained on a tablet canvas ----------
   Selected with #ipad-<width>x<height> (CSS px; rendered at 2x). The iPhone
   app runs on iPad, so the honest picture is the phone UI, framed, not a
   stretched full-screen version that does not exist. */
.deco { width: 100%; height: 100%; }
body.ipad .slide { width: var(--w); height: var(--h); }
body.ipad .slide .copy { top: 84px; left: 56px; right: 56px; }
body.ipad .slide h1 { font-size: 66px; }
body.ipad .slide .sub { font-size: 25px; max-width: 640px; margin: 18px auto 0; }
body.ipad .phone { transform-origin: 50% 0; }
</style>
</head>
<body>

  const pin = (x, y, label, color, big) => `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;z-index:5">
    ${big ? `<div style="background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:7px 12px;border-radius:99px;margin-bottom:6px;white-space:nowrap">${label}</div>` : ''}
    <div style="width:${big ? 46 : 36}px;height:${big ? 46 : 36}px;border-radius:99px 99px 99px 4px;transform:rotate(-45deg);background:${color};display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.2);border:3px solid #fff">
      <div style="transform:rotate(45deg);display:grid;place-items:center">${I('door', big ? 20 : 16, color === 'var(--yellow)' || color === 'var(--lime)' ? '#161616' : '#fff', 2.2)}</div></div>
    ${!big ? `<div style="margin-top:4px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.9);padding:2px 7px;border-radius:6px;white-space:nowrap">${label}</div>` : ''}
  </div>`;
  return `${map}
  ${status()}
  <div style="position:absolute;left:20px;right:20px;top:72px;z-index:10" class="row">
    <div class="row" style="flex:1;gap:10px;background:rgba(255,255,255,.95);border-radius:999px;padding:14px 18px;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.1)">${I('search', 20, 'var(--muted)')}<span class="muted">Search buildings & rooms</span></div>
  </div>
  <div class="row" style="position:absolute;left:20px;top:140px;gap:8px;z-index:10">
    <span class="chip" style="background:var(--ink);color:#fff;border-color:var(--ink)">All</span><span class="chip">Libraries</span><span class="chip">Lecture halls</span><span class="chip">Food</span>
  </div>
  ${pin(232, 318, 'Main Library', 'var(--violet)', true)}
  ${pin(380, 300, 'Science Block', 'var(--pink)')}
  ${pin(82, 420, 'Great Hall', 'var(--ink)')}
  ${pin(262, 470, 'Engineering', 'var(--yellow)')}
  <div style="position:absolute;right:20px;top:440px;width:48px;height:48px;border-radius:99px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:10">${I('locate', 22)}</div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:440px;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.1);padding:10px 20px 0;z-index:20">
    <div style="width:40px;height:5px;border-radius:9px;background:var(--border);margin:0 auto 14px"></div>
    <div class="row" style="gap:14px">
      <img src="${im('library')}" style="width:74px;height:74px;border-radius:16px">
      <div style="flex:1"><div style="font-family:BB;font-size:27px;line-height:1">Main Library</div>
        <div class="row" style="gap:8px;margin-top:6px;font-size:14px;font-weight:600"><span style="color:var(--success,#1F923A)">● Open now</span><span class="muted">· until 10:00 PM</span></div></div>
    </div>
    <div class="row" style="gap:8px;margin-top:16px">
      <span class="btn" style="background:var(--violet);color:#fff;flex:1">${I('pin', 17, '#fff', 2)}Directions</span>
      <span class="btn" style="background:var(--sunken);flex:1">${I('wifi', 17)}Wi-Fi zone</span>
    </div>
    <div style="font-weight:600;font-size:16px;margin:14px 0 6px">Rooms inside · 4 floors</div>
    ${[['Group Study Room 2B', 'Floor 2 · seats 8', 'Free'], ['Computer Lab', 'Floor 1 · 40 PCs', 'Busy'], ['Silent Reading Hall', 'Floor 3', 'Free']].map(([r, d, s]) => `
    <div class="row" style="gap:12px;padding:11px 0;border-top:1px solid var(--border)">
      <div style="width:38px;height:38px;border-radius:12px;background:var(--sunken);display:grid;place-items:center">${I('door', 19)}</div>
      <div style="flex:1"><div style="font-weight:600;font-size:15.5px">${r}</div><div class="muted" style="font-size:13px;font-weight:500">${d}</div></div>
      <span style="font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:99px;background:${s === 'Free' ? '#E3F5E6' : '#FCE8EF'};color:${s === 'Free' ? '#1F923A' : '#C21E5A'}">${s}</span>
    </div>`).join('')}
  </div>
  ${tabbar('campus')}`;
};

S.chat = () => {
  const them = (a, name, text, extra = '') => `<div class="row" style="gap:8px;align-items:flex-end;margin-top:12px">
      <img class="av" src="${im(a)}" style="width:30px;height:30px">
      <div style="max-width:290px"><div class="muted" style="font-size:12px;font-weight:600;margin:0 0 4px 4px">${name}</div>
      <div style="background:#fff;border-radius:20px 20px 20px 6px;padding:11px 15px;font-size:16px;line-height:1.35">${text}</div>${extra}</div></div>`;
  const me = (text) => `<div style="display:flex;justify-content:flex-end;margin-top:12px"><div style="max-width:290px;background:var(--violet);color:#fff;border-radius:20px 20px 6px 20px;padding:11px 15px;font-size:16px;line-height:1.35">${text}</div></div>`;
  return `${status()}
  <div class="row" style="gap:12px;padding:6px 18px 14px;border-bottom:1px solid var(--border);background:var(--warm)">
    ${I('back', 26)}
    <div style="width:46px;height:46px;border-radius:14px;background:var(--violet);display:grid;place-items:center;color:#fff;font-family:BB;font-size:20px">CS</div>
    <div style="flex:1"><div style="font-weight:600;font-size:17px">CS 201 Study Group</div><div style="font-size:13px;font-weight:500;color:#1F923A">6 members · 3 online</div></div>
    ${I('more', 24)}
  </div>
  <div style="padding:6px 16px 0">
    <div style="text-align:center;margin:10px 0 2px"><span class="muted" style="font-size:12.5px;font-weight:600;background:var(--sunken);padding:4px 10px;border-radius:99px">Today</span></div>
    ${them('a2', 'Kwame', 'Anyone free to go over recursion before Thursday’s quiz? 🤯')}
    ${them('a5', 'Efua', 'Yes please! Library 2B is free after 4', `<img src="${im('laptops')}" style="width:250px;height:150px;border-radius:16px;margin-top:6px">`)}
    ${me('I’m in. I’ll bring last year’s past questions 📚')}
    <div class="row" style="gap:8px;align-items:flex-end;margin-top:12px">
      <img class="av" src="${im('a3')}" style="width:30px;height:30px">
      <div style="background:#fff;border-radius:20px 20px 20px 6px;padding:14px 15px;width:290px">
        <div style="font-size:12px;font-weight:600;color:var(--violet)">POLL · Kofi</div>
        <div style="font-weight:600;font-size:16px;margin:4px 0 10px">What time works best?</div>
        ${[['4:00 PM', 67, true], ['6:00 PM', 33, false]].map(([o, p, w]) => `
        <div style="position:relative;height:40px;border-radius:12px;background:var(--sunken);overflow:hidden;margin-top:7px">
          <div style="position:absolute;inset:0;width:${p}%;background:${w ? 'rgba(108,59,255,.22)' : 'rgba(0,0,0,.06)'}"></div>
          <div class="row" style="position:relative;justify-content:space-between;height:100%;padding:0 12px;font-weight:600;font-size:15px"><span class="row" style="gap:6px">${w ? I('check', 16, 'var(--violet)', 2.6) : ''}${o}</span><span>${p}%</span></div></div>`).join('')}
      </div>
    </div>
    <div class="row" style="gap:8px;margin-top:10px;margin-left:38px"><span class="row" style="gap:3px;background:#fff;border:1px solid var(--border);border-radius:99px;padding:3px 8px;font-size:13px">🔥 <b style="font-weight:600">4</b></span><span class="muted" style="font-size:12.5px;font-weight:500">Seen by 5</span></div>
    ${me('Booked 2B for 4 ✅ see you there')}
  </div>
  <div class="row" style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 40px;gap:10px;background:var(--warm);border-top:1px solid var(--border)">
    <div style="width:44px;height:44px;border-radius:99px;background:#fff;border:1px solid var(--border);display:grid;place-items:center">${I('img', 21)}</div>
    <div style="flex:1;background:#fff;border:1px solid var(--border);border-radius:99px;padding:12px 16px;font-size:16px" class="muted">Message…</div>
    <div style="width:44px;height:44px;border-radius:99px;background:var(--violet);display:grid;place-items:center">${I('send', 20, '#fff', 2)}</div>
  </div>`;
};

S.profile = () => `${status(true)}
<div style="position:absolute;top:0;left:0;right:0;height:250px;overflow:hidden"><img src="${im('grad')}" style="width:100%;height:100%"><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,0) 50%)"></div></div>
<div style="position:relative;z-index:2;padding:0 20px">
  <div class="row" style="justify-content:flex-end;gap:10px;margin-top:2px">
    <div style="width:42px;height:42px;border-radius:99px;background:rgba(22,22,22,.5);display:grid;place-items:center">${I('menu', 21, '#fff')}</div></div>
  <div style="margin-top:96px" class="row">
    <div style="padding:4px;border-radius:99px;background:var(--warm)"><img class="av" src="${im('a1')}" style="width:112px;height:112px"></div>
  </div>
  <div class="row" style="justify-content:space-between;margin-top:10px">
    <div><div style="font-family:BB;font-size:32px;line-height:1">Ama Mensah</div>
      <div style="font-size:15px;font-weight:500;color:var(--text2);margin-top:6px">BSc Computer Science · Year 2</div></div>
    <span class="btn" style="background:var(--lime);color:var(--ink)">${I('edit', 16, 'var(--ink)', 2)}Edit</span>
  </div>
  <div style="font-size:15.5px;line-height:1.4;margin-top:12px">Building things that help students 💜 Hackathon addict, jollof critic, Hall 3 rep.</div>
  <div class="row" style="gap:6px;margin-top:12px;flex-wrap:wrap">${['💻 Coding', '🎨 Design', '⚽ Football', '🎧 Afrobeats'].map((t) => `<span class="chip" style="padding:6px 11px;font-size:13px">${t}</span>`).join('')}</div>
  <div class="row card" style="margin-top:16px;padding:14px 0">
    ${[['86', 'Posts'], ['1.2k', 'Connections'], ['24', 'Events']].map(([n, l], i) => `<div style="flex:1;text-align:center;${i ? 'border-left:1px solid var(--border)' : ''}"><div style="font-weight:600;font-size:21px">${n}</div><div class="muted" style="font-size:13px;font-weight:500">${l}</div></div>`).join('')}
  </div>
  <div class="row" style="gap:24px;margin-top:16px;font-weight:600;font-size:15.5px;border-bottom:1px solid var(--border)">
    <span style="padding-bottom:10px;border-bottom:2.5px solid var(--ink)">Posts</span><span class="muted" style="padding-bottom:10px">Events</span><span class="muted" style="padding-bottom:10px">Saved</span></div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:3px;position:relative;z-index:2">
  ${['friends', 'sunset', 'study', 'concert', 'cafe', 'hall'].map((p) => `<img src="${im(p)}" style="width:100%;height:146px">`).join('')}
</div>
${tabbar('profile')}`;

// ---------- slides ----------
const SLIDES = [
  { screen: 'home', bg: 'var(--violet)', fg: '#F8F7F4', h: 'Your whole campus<br>in one app', sub: 'Posts, stories and what’s happening today, from the people you actually know.', deco: 'orbit' },
  { screen: 'events', bg: 'var(--yellow)', fg: '#161616', h: 'Never miss<br>what’s on', sub: 'Parties, games, talks and club nights. Tap Going and you’re in.', deco: 'dots' },
  { screen: 'connect', bg: 'var(--pink)', fg: '#161616', h: 'Meet people<br>who get you', sub: 'Find students on your course and in your hall who like what you like.', deco: 'rays' },
  { screen: 'campus', bg: 'var(--lime)', fg: '#161616', h: 'Find any building,<br>any room', sub: 'A live campus map with every lecture hall, lab and study space.', deco: 'dots' },
  { screen: 'chat', bg: 'var(--ink)', fg: '#F8F7F4', h: 'Chat, plan<br>and study together', sub: 'Direct messages and group chats with photos, polls and reactions.', deco: 'orbit' },
  { screen: 'profile', bg: '#F8F7F4', fg: '#161616', h: 'Show the world<br>who you are', sub: 'Your course, interests and best moments, all on one profile.', deco: 'rays', accent: 'var(--violet)' },
];

const deco = (kind, fg) => {
  const c = fg === '#161616' ? 'rgba(22,22,22,.09)' : 'rgba(248,247,244,.11)';
  if (kind === 'dots') return `<svg class="deco" viewBox="0 0 440 956" preserveAspectRatio="xMidYMid slice"><defs><pattern id="d${Math.random()}" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.2" fill="${c}"/></pattern></defs><rect width="440" height="956" fill="url(#d)"/></svg>`.replace(/id="d[^"]+"/, 'id="dp"').replace('url(#d)', 'url(#dp)');
  if (kind === 'orbit') return `<svg class="deco" viewBox="0 0 440 956" preserveAspectRatio="xMidYMid slice">${[180, 260, 340, 420, 500].map((r) => `<circle cx="220" cy="620" r="${r}" fill="none" stroke="${c}" stroke-width="2"/>`).join('')}</svg>`;
  return `<svg class="deco" viewBox="0 0 440 956" preserveAspectRatio="xMidYMid slice">${Array.from({ length: 18 }, (_, i) => { const a = (i / 18) * Math.PI * 2; return `<line x1="220" y1="600" x2="${220 + Math.cos(a) * 900}" y2="${600 + Math.sin(a) * 900}" stroke="${c}" stroke-width="${i % 2 ? 2 : 16}"/>`; }).join('')}</svg>`;
};

const IPAD = location.hash.match(/^#ipad-(\d+)x(\d+)$/);
if (IPAD) {
  const [w, h] = [Number(IPAD[1]), Number(IPAD[2])];
  document.body.classList.add('ipad');
  document.body.style.setProperty('--w', `${w}px`);
  document.body.style.setProperty('--h', `${h}px`);
}

document.getElementById('out').innerHTML = SLIDES.map((s, i) => `
<section class="slide" id="s${i + 1}" style="background:${s.bg};color:${s.fg}">
  ${deco(s.deco, s.fg)}
  <div class="copy"><h1>${s.accent ? s.h.replace('who you are', `<span style="color:${s.accent}">who you are</span>`) : s.h}</h1><div class="sub">${s.sub}</div></div>
  <div class="phone"><div class="island"></div><div class="screen"><div class="ui">${S[s.screen]()}</div></div></div>
</section>`).join('');

// iPad: headlines wrap differently per slide, so each phone sits under its own
// copy and is scaled to fill the rest of the canvas, with a fixed bottom margin.
if (IPAD) {
  const h = Number(IPAD[2]);
  document.fonts.ready.then(() => {
    for (const slide of document.querySelectorAll('.slide')) {
      const top = slide.querySelector('.copy').getBoundingClientRect().bottom
        - slide.getBoundingClientRect().top + 40;
      const phone = slide.querySelector('.phone');
      phone.style.top = `${top}px`;
      phone.style.transform = `scale(${((h - top - 44) / 697).toFixed(3)})`;
    }
    document.body.dataset.ready = '1';
  });
}
</script>
</body>
</html>
